name: Bootstrap User

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/bootstrap-user.yml'
      - 'scripts/extract-user.mjs'
      - 'scripts/check-boundary.mjs'
      - 'scripts/check-syntax.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout User
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Fetch source core
        run: git clone --depth 1 --branch staging https://github.com/co-va/core.git /tmp/co-va-core

      - name: Extract User contour
        run: node scripts/extract-user.mjs /tmp/co-va-core

      - name: Check User boundary
        run: node scripts/check-boundary.mjs

      - name: Check User syntax and dependencies
        run: node scripts/check-syntax.mjs

      - name: Commit extracted runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No runtime changes"
            exit 0
          fi
          git commit -m "Extract User runtime from core staging"
          git push origin staging
