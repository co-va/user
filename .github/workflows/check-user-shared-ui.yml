# CI scope: shared UI
name: User / Shared UI

on:
  push:
    branches:
      - staging
      - main
    paths:
      - 'ui/**'
      - 'css/**'
      - 'scripts/ci/guard-shared-ui.mjs'
      - 'scripts/ci/user-shared-mini-card-smoke.mjs'
      - 'user/account-shell.js'
      - 'user/calendar-integrations.js'
      - 'user/record-create.js'
      - 'user/journal.js'
      - 'scripts/ci/guard-lib.mjs'
      - '.github/workflows/check-user-shared-ui.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ui/**'
      - 'css/**'
      - 'scripts/ci/guard-shared-ui.mjs'
      - 'scripts/ci/user-shared-mini-card-smoke.mjs'
      - 'user/account-shell.js'
      - 'user/calendar-integrations.js'
      - 'user/record-create.js'
      - 'user/journal.js'
      - 'scripts/ci/guard-lib.mjs'
      - '.github/workflows/check-user-shared-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared User + Professional UI contract
        run: |
          node scripts/ci/guard-shared-ui.mjs
          node scripts/ci/user-shared-mini-card-smoke.mjs
