name: Check User

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-user:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check User boundary
        run: node scripts/check-boundary.mjs

      - name: Check User syntax and dependencies
        run: node scripts/check-syntax.mjs

      - name: Build User container
        run: docker build -t co-va-user-check .
