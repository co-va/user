name: User / Check

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Allow only staging PRs to main
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          test "${{ github.head_ref }}" = "staging" || {
            echo "main accepts pull requests only from staging";
            exit 1;
          }

      - name: Repository contract
        run: node scripts/ci/guard-repository.mjs

      - name: Shared UI contract
        run: node scripts/ci/guard-shared-ui.mjs

      - name: Profile contract
        run: node scripts/ci/guard-profile.mjs

      - name: Record contract
        run: node scripts/ci/guard-record.mjs

      - name: JavaScript syntax
        shell: bash
        run: |
          find core user ui scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check
          node --check service-worker.js

      - name: Local UI browser smoke
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/ci/shared-keyboard-layout-smoke.mjs
          node scripts/ci/user-profile-keyboard-smoke.mjs
          node scripts/ci/user-journal-record-smoke.mjs
          node scripts/ci/user-email-verification-smoke.mjs

      # Staging Smoke already checks live Amvera HTTPS/HTML/JS/API on every
      # push. Run the full live browser login/expired-session scenario at
      # the PR gate, not simultaneously for the same SHA on push and PR.
      # This retains both required real-service and Chromium protections.
      - name: Live User browser login and expired session (PR gate)
        if: github.event_name != 'push'
        run: node scripts/ci/user-runtime-smoke.mjs
