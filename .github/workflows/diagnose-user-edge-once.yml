name: Diagnose User edge once
on:
  push:
    branches: [staging]
permissions:
  contents: read
jobs:
  edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Examine domain verification and TLS SNI
        shell: bash
        run: |
          echo '=== DNS: user CNAME (required by Amvera for third-level domain) ==='
          dig +short CNAME user.va-tools.ru
          echo '=== DNS: verification TXT presence ==='
          count="$(dig +short TXT _amvera.user.va-tools.ru | wc -l)"
          echo "TXT record count: $count"
          echo '=== DNS: api and user aliases ==='
          dig +short A user.va-tools.ru
          dig +short A api.va-tools.ru
          echo '=== TLS: 3 attempts for each SNI (cert metadata only) ==='
          for host in user.va-tools.ru api.va-tools.ru; do
            for i in 1 2 3; do
              echo "TLS $host attempt $i"
              printf '' | timeout 9 openssl s_client -connect 185.147.26.234:443 -servername "$host" -tls1_2 -brief 2>&1 | grep -E 'Protocol|Ciphersuite|Peer certificate|error|unexpected eof|write:errno|CONNECTED|Verification' | head -9 || true
            done
          done
      - name: Repeated HTTP probes from external network
        shell: bash
        run: |
          for url in https://user.va-tools.ru/ https://user.va-tools.ru/user/main.js https://user.va-tools.ru/css/style.css https://user-volokovykh.msk1.amvera.tech/ https://api.va-tools.ru/admin/; do
            echo "=== $url ==="
            for i in 1 2 3 4 5; do
              printf "attempt=%s " "$i"
              curl --http1.1 --connect-timeout 5 --max-time 10 --silent --show-error --location --output /dev/null \
                --write-out 'code=%{http_code} ssl_verify=%{ssl_verify_result} remote_ip=%{remote_ip} total=%{time_total} content_type=%{content_type}\n' "$url" || true
              sleep 1
            done
          done
