name: One-time fix User contact click

on:
  push:
    branches: [staging]
    paths: [.github/workflows/fix-contact-click-once.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Fix and verify local contact navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('user/account-shell.js')
          text = path.read_text()
          old = '''function bindGlobalRelationships(root, state, handlers) {
            root.querySelectorAll('[data-global-relationship]').forEach((node) => node.addEventListener('click', () => {
              const tenantId = String(node.dataset.globalRelationship || '');
              if (!tenantId) return;
              state.accountSelectedContactTenantId = tenantId;
              state.accountTab = 'contact-detail';
              state.accountDeckActive = 'contacts';
              state.accountDeckOpen = false;
              void handlers.render();
            }));
          }
          '''
          new = '''function bindGlobalRelationships(root, state, handlers) {
            const host = root.querySelector('[data-account-contact-list]');
            if (!host || host.dataset.relationshipNavigationBound === 'true') return;
            host.dataset.relationshipNavigationBound = 'true';
            host.addEventListener('click', (event) => {
              const node = event.target?.closest?.('[data-global-relationship]');
              if (!node || !host.contains(node)) return;
              const tenantId = String(node.dataset.globalRelationship || '');
              if (!tenantId) return;
              state.accountSelectedContactTenantId = tenantId;
              state.accountTab = 'contact-detail';
              state.accountDeckActive = 'contacts';
              state.accountDeckOpen = false;
              void handlers.render();
            });
          }
          '''
          if old not in text:
            raise SystemExit('expected bindGlobalRelationships implementation not found')
          path.write_text(text.replace(old, new, 1))
          PY

          node --check user/account-shell.js
          node scripts/check-boundary.mjs
          node scripts/check-syntax.mjs
          git diff --check

          docker build -t co-va-user-contact-check .
          docker run -d --rm --name co-va-user-contact-check -p 3000:3000 co-va-user-contact-check
          trap 'docker logs co-va-user-contact-check || true; docker stop co-va-user-contact-check >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          cat >/tmp/contact-smoke.html <<'HTML'
          <!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Contact click smoke</title></head>
          <body data-contact-smoke="pending"><div id="root"></div><pre id="error"></pre>
          <script type="module">
            globalThis.fetch = async () => { throw new Error('NETWORK_FORBIDDEN_DURING_CONTACT_CLICK'); };
            const { renderGlobalAccount } = await import('/user/account-shell.js');
            const root = document.querySelector('#root');
            const state = {
              account: { id: 'u1', name: 'User', surname: 'Test', phone: '+70000000000', profileData: {} },
              accountTab: 'contacts', accountDeckActive: 'contacts', accountDeckOpen: false, accountZEnter: false,
              accountRecords: [],
              relationships: [{ tenantId: 'professional-1', context: { profile: { name: 'Александр', surname: 'Балаковых', profession: 'Парикмахер' } } }],
            };
            try {
              await renderGlobalAccount(root, state, {});
              const card = root.querySelector('[data-global-relationship="professional-1"]');
              if (!card) throw new Error('contact card missing');
              card.click();
              await new Promise((resolve) => setTimeout(resolve, 0));
              const booking = root.querySelector('[data-global-contact-booking]');
              if (!booking || state.accountTab !== 'contact-detail') throw new Error('contact detail did not open synchronously');
              document.body.dataset.contactSmoke = 'pass';
            } catch (error) {
              document.body.dataset.contactSmoke = 'fail';
              document.querySelector('#error').textContent = String(error?.stack || error);
            }
          </script></body></html>
          HTML
          docker cp /tmp/contact-smoke.html co-va-user-contact-check:/usr/share/nginx/html/contact-smoke.html
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom http://127.0.0.1:3000/contact-smoke.html >/tmp/contact-dom.html 2>/tmp/contact-chrome.log || true
          cat /tmp/contact-chrome.log
          grep -q 'data-contact-smoke="pass"' /tmp/contact-dom.html || { cat /tmp/contact-dom.html; exit 1; }

          rm .github/workflows/fix-contact-click-once.yml
          git config user.name co-tools
          git config user.email a.volokovykh@yandex.ru
          git add -A
          git commit -m 'Make User contact navigation immediate and local'
          git push origin HEAD:staging
