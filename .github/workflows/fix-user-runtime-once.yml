name: One-time User runtime fix

on:
  push:
    branches: [staging]
    paths: [.github/workflows/fix-user-runtime-once.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Fix selected profile hydration and booking preload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          account = Path('user/account.js')
          s = account.read_text()
          old = """  const callbacks = accountCallbacks(root, state);
          await renderGlobalAccount(root, state, callbacks);

          const tab = String(state.accountTab || 'journal');
          """
          new = """  const callbacks = accountCallbacks(root, state);
          await renderGlobalAccount(root, state, callbacks);
          window.dispatchEvent(new CustomEvent('cova:user-session-ready'));

          const tab = String(state.accountTab || 'journal');
          """
          assert old in s
          account.write_text(s.replace(old, new, 1))

          main = Path('user/main.js')
          s = main.read_text()
          marker = """window.addEventListener('cova:user-booking-created', (event) => {
          const detail = event?.detail && typeof event.detail === 'object' ? event.detail : {};
          void renderUser({
            tab: 'journal',
            journalDate: String(detail.date || ''),
          });
          });

          window.addEventListener('resize', syncViewport, { passive: true });
          """
          replacement = """window.addEventListener('cova:user-booking-created', (event) => {
          const detail = event?.detail && typeof event.detail === 'object' ? event.detail : {};
          void renderUser({
            tab: 'journal',
            journalDate: String(detail.date || ''),
          });
          });

          window.addEventListener('cova:user-session-ready', () => {
            if (bookingRuntimeReady || bookingRuntimePromise) return;
            window.setTimeout(() => { void ensureBookingRuntime(); }, 0);
          });

          window.addEventListener('resize', syncViewport, { passive: true });
          """
          assert marker in s
          main.write_text(s.replace(marker, replacement, 1))

          shell = Path('user/account-shell.js')
          s = shell.read_text()
          old_import = """import {
            accountErrorMessage,
            updateGlobalAccount,
          """
          new_import = """import {
            accountErrorMessage,
            getBookingContext,
            updateGlobalAccount,
          """
          assert old_import in s
          s = s.replace(old_import, new_import, 1)

          old_detail = """async function renderGlobalContactDetail(root, state, handlers) {
            const relationship = selectedGlobalRelationship(state);
            if (!relationship) {
              state.accountTab = 'contacts';
              state.accountDeckActive = 'contacts';
              await handlers.render();
              return;
            }

            const tenantId = String(relationship.tenantId || '');
            const records = globalContactRecords(state, tenantId);
          """
          new_detail = """async function renderGlobalContactDetail(root, state, handlers) {
            let relationship = selectedGlobalRelationship(state);
            if (!relationship) {
              state.accountTab = 'contacts';
              state.accountDeckActive = 'contacts';
              await handlers.render();
              return;
            }

            const tenantId = String(relationship.tenantId || '');
            const bookingContext = await getBookingContext(tenantId).catch(() => null);
            if (bookingContext && typeof bookingContext === 'object') {
              const currentContext = relationship?.context && typeof relationship.context === 'object'
                ? relationship.context
                : {};
              const loadedProfile = bookingContext?.profile && typeof bookingContext.profile === 'object'
                ? bookingContext.profile
                : bookingContext?.context?.profile && typeof bookingContext.context.profile === 'object'
                  ? bookingContext.context.profile
                  : null;
              const loadedWorkplaces = Array.isArray(bookingContext?.workplaces)
                ? bookingContext.workplaces
                : Array.isArray(bookingContext?.context?.workplaces)
                  ? bookingContext.context.workplaces
                  : null;
              if (loadedProfile || loadedWorkplaces) {
                relationship = {
                  ...relationship,
                  context: {
                    ...currentContext,
                    ...(loadedProfile ? { profile: { ...(currentContext.profile || {}), ...loadedProfile } } : {}),
                    ...(loadedWorkplaces ? { workplaces: loadedWorkplaces } : {}),
                  },
                };
                state.relationships = (Array.isArray(state.relationships) ? state.relationships : [])
                  .map((item) => String(item?.tenantId || '') === tenantId ? relationship : item);
              }
            }
            const records = globalContactRecords(state, tenantId);
          """
          assert old_detail in s
          shell.write_text(s.replace(old_detail, new_detail, 1))
          PY

          node --check user/account.js
          node --check user/main.js
          node --check user/account-shell.js
          node scripts/check-boundary.mjs
          node scripts/check-syntax.mjs
          git diff --check

          rm .github/workflows/fix-user-runtime-once.yml
          git config user.name co-tools
          git config user.email a.volokovykh@yandex.ru
          git add -A
          git commit -m 'Fix User profile hydration and booking preload'
          git push origin HEAD:staging
