name: One-time clean User rebuild

on:
  push:
    branches: [staging]
    paths: [.github/workflows/rebuild-clean-user-once.yml]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Rebuild clean User contour
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          shell_path = Path('user/account-shell.js')
          s = shell_path.read_text()

          # Remove modules that belong to the old heavy contact/business contour.
          for block in [
            "import { readOnlyReceipt } from '../ui/receipt/index.js';\n",
            "import { personalAccountVisualCard } from './personal-account-card.js';\n",
            """import {
            depositCardAppearance,
            depositCardFields,
            depositCardPhoto,
            depositCardPhotoPosition,
          } from '../core/loyalty/deposit/card-presentation.js';
          """,
            "import { getGlobalPersonalAccounts } from './personal-account-data.js';\n",
            "import { getGlobalDeposits } from './deposit-data.js';\n",
          ]:
            assert block in s, block
            s = s.replace(block, '', 1)

          # Remove old record/payment helpers used only by the heavy contact history.
          start = s.index('function money(value) {')
          end = s.index('function accountName(state) {', start)
          s = s[:start] + s[end:]

          # Normalize the lightweight contact card payload without loading Professional runtime.
          start = s.index('function relationshipTitle(relationship = {}) {')
          end = s.index('const ACCOUNT_PROFILE_CARD_APPEARANCE', start)
          replacement = r'''function relationshipProfile(relationship = {}) {
            const context = relationship?.context && typeof relationship.context === 'object' ? relationship.context : {};
            const nested = context?.profile && typeof context.profile === 'object' ? context.profile : {};
            const direct = relationship?.profile && typeof relationship.profile === 'object' ? relationship.profile : {};
            const card = relationship?.card && typeof relationship.card === 'object' ? relationship.card : {};
            const cardProfile = card?.profile && typeof card.profile === 'object' ? card.profile : {};
            const source = Object.keys(direct).length ? direct : Object.keys(nested).length ? nested : cardProfile;
            return {
              ...source,
              name: String(source.name || relationship.name || card.name || '').trim(),
              surname: String(source.surname || relationship.surname || card.surname || '').trim(),
              profession: String(source.profession || relationship.profession || card.profession || '').trim(),
              phone: String(source.phone || relationship.phone || card.phone || '').trim(),
              photo: String(source.photo || source.image || source.avatar || relationship.photo || relationship.image || relationship.avatar || card.photo || card.image || card.avatar || ''),
              photoCropX: Number(source.photoCropX ?? relationship.photoCropX ?? card.photoCropX ?? 50),
              photoCropY: Number(source.photoCropY ?? relationship.photoCropY ?? card.photoCropY ?? 50),
            };
          }

          function relationshipWorkplaces(relationship = {}) {
            if (Array.isArray(relationship?.context?.workplaces)) return relationship.context.workplaces;
            if (Array.isArray(relationship?.workplaces)) return relationship.workplaces;
            return [];
          }

          function relationshipTitle(relationship = {}) {
            const profile = relationshipProfile(relationship);
            return [profile.name, profile.surname].filter(Boolean).join(' ').trim() || 'Профиль';
          }

          function relationshipCard(relationship = {}, { interactive = true } = {}) {
            const profile = relationshipProfile(relationship);
            const title = relationshipTitle(relationship);
            return entityVisualCard({
              appearance: profileCardAppearance(profile),
              fields: profileCardFields(profile, []),
              image: String(profile.photo || ''),
              imagePosition: `${Number(profile.photoCropX || 50)}% ${Number(profile.photoCropY || 50)}%`,
              interactive,
              data: interactive ? `data-global-relationship="${escapeHtml(String(relationship.tenantId || ''))}"` : '',
              aria: interactive ? `Открыть ${title}` : title,
            });
          }

          '''
          s = s[:start] + replacement + s[end:]

          # Use the normalized lightweight card everywhere contacts are shown.
          s = s.replace('const profile = relationship?.context?.profile || {};\n        const title = relationshipTitle(relationship);', 'const profile = relationshipProfile(relationship);\n        const title = relationshipTitle(relationship);')
          s = s.replace('const profile = relationship?.context?.profile || {};\n  return [', 'const profile = relationshipProfile(relationship);\n  return [')
          old_journal = """        const workplaces = Array.isArray(relationship?.context?.workplaces) ? relationship.context.workplaces : [];
          return {
            professional: relationship?.context?.profile || null,
            workplace: workplaces.find((item) => String(item?.key || item?.id || '') === String(record?.workplaceId || '')) || null,
          };
          """
          new_journal = """        const workplaces = relationshipWorkplaces(relationship || {});
          return {
            professional: relationship ? relationshipProfile(relationship) : null,
            workplace: workplaces.find((item) => String(item?.key || item?.id || '') === String(record?.workplaceId || '')) || null,
          };
          """
          assert old_journal in s
          s = s.replace(old_journal, new_journal, 1)

          # Replace the entire old contact detail/business-history contour with a minimal contact card.
          start = s.index('function selectedGlobalRelationship(state) {')
          end = s.index('export async function renderGlobalAccount', start)
          minimal = r'''function selectedGlobalRelationship(state) {
            const tenantId = String(state.accountSelectedContactTenantId || '');
            return (Array.isArray(state.relationships) ? state.relationships : [])
              .find((relationship) => String(relationship?.tenantId || '') === tenantId) || null;
          }

          function confirmDeleteGlobalContact(state, handlers, relationship) {
            const tenantId = String(relationship?.tenantId || '');
            const title = relationshipTitle(relationship);
            if (!tenantId) return;
            const layer = mountModal(document.body, modal(`<div class="modal-title"><h2>Удалить контакт?</h2><p>${escapeHtml(title)} будет убран из Контактов. Все действующие согласия будут отозваны.</p></div><div class="form-error" data-contact-delete-error></div><div class="modal-actions">${button('Удалить', { variant: 'danger', data: 'data-confirm-delete-contact' })}${button('Отмена', { variant: 'secondary', data: 'data-cancel-delete-contact' })}</div>`, { variant: 'x', title: 'Удаление контакта' }));
            layer?.querySelector('[data-cancel-delete-contact]')?.addEventListener('click', () => layer.v2Close?.());
            layer?.querySelector('[data-confirm-delete-contact]')?.addEventListener('click', async (event) => {
              event.currentTarget.disabled = true;
              try {
                await deleteGlobalAccountRelationship(tenantId);
                state.relationships = (Array.isArray(state.relationships) ? state.relationships : [])
                  .filter((item) => String(item?.tenantId || '') !== tenantId);
                state.accountSelectedContactTenantId = '';
                state.accountTab = 'contacts';
                state.accountDeckActive = 'contacts';
                layer.v2Close?.();
                await handlers.render?.();
              } catch (error) {
                event.currentTarget.disabled = false;
                const errorNode = layer.querySelector('[data-contact-delete-error]');
                if (errorNode) errorNode.textContent = accountErrorMessage(error, 'Не удалось удалить контакт');
              }
            });
          }

          function openGlobalContactSettings(state, handlers, relationship) {
            const tenantId = String(relationship?.tenantId || '');
            if (!tenantId) return null;
            return openSharedProfileSettingsMenu({
              title: 'Настройки',
              actions: [
                { id: 'consents', label: 'Согласия', onSelect: () => void openAccountConsentSettings(state, { tenantId, onChanged: () => {} }) },
                { id: 'delete', label: 'Удалить', variant: 'critical', onSelect: () => confirmDeleteGlobalContact(state, handlers, relationship) },
              ],
              data: 'data-global-contact-settings-menu',
            });
          }

          async function renderGlobalContactDetail(root, state, handlers) {
            const relationship = selectedGlobalRelationship(state);
            if (!relationship) {
              state.accountTab = 'contacts';
              state.accountDeckActive = 'contacts';
              await handlers.render();
              return;
            }

            const profile = relationshipProfile(relationship);
            const title = relationshipTitle(relationship);
            renderV2Shell(root, state, {
              header: v2Header({
                a: { kind: 'avatar', label: title, image: String(profile.photo || '') },
                b: title,
              }),
              v: { data: 'data-global-contact-settings', aria: 'Настройки контакта' },
              body: `${entityCardStack([relationshipCard(relationship, { interactive: false })])}${actionBlock(button('Записаться', {
                data: 'data-global-contact-booking',
                aria: `Записаться к ${title}`,
              }))}`,
            });
            bindWorkspaceInteraction(root, state, handlers);
            root.querySelector('[data-global-contact-settings]')?.addEventListener('click', () => openGlobalContactSettings(state, handlers, relationship));
            root.querySelector('[data-global-contact-booking]')?.addEventListener('click', () => {
              handlers.onStartBooking?.(String(relationship.tenantId || ''), { entry: 'profile' });
            });
          }

          '''
          s = s[:start] + minimal + s[end:]

          # The deleted contour must be physically gone.
          for forbidden in [
            'getGlobalPersonalAccounts',
            'getGlobalDeposits',
            'contactDeposit',
            'contactPersonalAccount',
            'contactHistoryMiniCard',
            'contactWorkplaceRail',
            "v2Section('Инвестиции / займы'",
          ]:
            assert forbidden not in s, forbidden
          shell_path.write_text(s)

          # Load only User data needed by the active surface.
          account_path = Path('user/account.js')
          a = account_path.read_text()
          old = """  const needsRelationships = tab === 'profile'
            || tab === 'profile-settings'
            || tab === 'journal'
            || tab === 'contacts'
            || tab === 'contact-detail';
          const needsRecords = tab === 'journal' || tab === 'contact-detail';
          """
          new = """  const needsRelationships = tab === 'journal'
            || tab === 'contacts'
            || tab === 'contact-detail';
          const needsRecords = tab === 'journal';
          """
          assert old in a
          account_path.write_text(a.replace(old, new, 1))

          # Preload Booking code after User has rendered. Data/schedule still loads only inside Booking actions.
          main_path = Path('user/main.js')
          m = main_path.read_text()
          insert_after = """async function ensureBookingRuntime() {
            if (!bookingRuntimePromise) {
              bookingRuntimePromise = import('../booking/entry.js').then((module) => {
                bookingRuntimeReady = true;
                return module;
              });
            }
            return bookingRuntimePromise;
          }
          """
          preload = insert_after + """
          function preloadBookingRuntime() {
            if (bookingRuntimePromise || bookingRuntimeReady) return;
            const load = () => { void ensureBookingRuntime(); };
            if (typeof window.requestIdleCallback === 'function') window.requestIdleCallback(load, { timeout: 1200 });
            else window.setTimeout(load, 0);
          }
          """
          assert insert_after in m
          m = m.replace(insert_after, preload, 1)
          assert m.rstrip().endswith('await renderUser();')
          m = m.rstrip() + '\npreloadBookingRuntime();\n'
          main_path.write_text(m)
          PY

          node --check user/account-shell.js
          node --check user/account.js
          node --check user/main.js
          node scripts/check-boundary.mjs
          node scripts/check-syntax.mjs
          git diff --check

          rm .github/workflows/rebuild-clean-user-once.yml
          git config user.name co-tools
          git config user.email a.volokovykh@yandex.ru
          git add -A
          git commit -m 'Rebuild User around minimal data boundaries'
          git push origin HEAD:staging
