name: User / Staging Asset Integrity

on:
  push:
    branches: [staging]
    paths:
      - 'index.html'
      - 'css/**'
      - 'core/**'
      - 'user/**'
      - 'ui/**'
      - 'service-worker.js'
      - '.github/workflows/staging-asset-integrity.yml'
      - 'scripts/ci/staging-asset-integrity.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the staging preview against this staging commit
        env:
          USER_PREVIEW_BASE: https://user-volokovykh.msk1.amvera.tech
        run: node scripts/ci/staging-asset-integrity.mjs
      - name: Check out the actual production source revision
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Verify production against main, never against unmerged staging
        working-directory: production
        env:
          USER_PREVIEW_BASE: https://user.va-tools.ru
        run: node ../scripts/ci/staging-asset-integrity.mjs
