name: User / Staging Smoke

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-staging-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify live Amvera staging preview
        shell: bash
        run: |
          set -euo pipefail
          base='https://user-volokovykh.msk1.amvera.tech'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # Keep real HTTPS/HTML/API assertions. Amvera edge intermittently
          # drops connections during TLS handshake; default curl retry does
          # not retry error 35 without --retry-all-errors.
          fetch() {
            curl --silent --show-error --location \
              --retry 10 --retry-all-errors --retry-delay 4 \
              --retry-max-time 180 --connect-timeout 12 --max-time 25 "$@"
          }

          fetch --fail \
            -D "$tmp/index.headers" "$base/" -o "$tmp/index.html"
          grep -qi '^x-co-va-preview: staging' "$tmp/index.headers"
          grep -q 'user/main.js' "$tmp/index.html"

          fetch --fail \
            -D "$tmp/js.headers" "$base/user/main.js" -o "$tmp/main.js"
          grep -qi '^x-co-va-preview: staging' "$tmp/js.headers"
          grep -qi '^content-type:.*javascript' "$tmp/js.headers"

          fetch --fail \
            -D "$tmp/css.headers" "$base/ui/v2/v2.css" -o "$tmp/v2.css"
          grep -qi '^x-co-va-preview: staging' "$tmp/css.headers"
          grep -qi '^content-type:.*text/css' "$tmp/css.headers"

          status="$(fetch \
            -D "$tmp/api.headers" -o "$tmp/api.body" \
            -H 'Authorization: Bearer ci-invalid-user-token' \
            -w '%{http_code}' "$base/api/account/me")"
          test "$status" = '401' -o "$status" = '403'
          grep -qi '^x-co-va-preview: staging' "$tmp/api.headers"

          # The old same-origin /api bridge remains read-only for safety.
          blocked_status="$(fetch -o /dev/null -w '%{http_code}' \
            -X PUT "$base/api/account/me")"
          test "$blocked_status" = '405'

          # User's actual runtime talks directly to Core. Its CORS allowlist
          # includes this exact Amvera origin. Use invalid credentials so these
          # checks can NEVER write user data.
          api='https://api.va-tools.ru'
          cors_status="$(fetch -D "$tmp/cors.headers" -o /dev/null -w '%{http_code}' \
            -X OPTIONS "$api/account/me" \
            -H "Origin: $base" \
            -H 'Access-Control-Request-Method: PUT' \
            -H 'Access-Control-Request-Headers: authorization,content-type')"
          test "$cors_status" = '200' -o "$cors_status" = '204'
          grep -Fqi "access-control-allow-origin: $base" "$tmp/cors.headers"
          for route in \
            'PUT /account/me' \
            'PUT /account/events/ci-denied-id' \
            'PUT /account/notes/ci-denied-id' \
            'POST /account/contacts/ci-denied-id/records'; do
            method="${route%% *}"
            path="${route#* }"
            write_status="$(fetch -o /dev/null -w '%{http_code}' \
              -X "$method" "$api$path" \
              -H 'Authorization: Bearer ci-invalid-user-token' \
              -H "Origin: $base" \
              -H 'Content-Type: application/json' -d '{}')"
            case "$write_status" in
              401|403) ;;
              *) echo "Core write contract failed: $method $path -> $write_status"; exit 1 ;;
            esac
          done
