name: User / Production Availability

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
    - cron: '5 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-production-availability
  cancel-in-progress: true

jobs:
  edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify HTTPS, production entry, JS and Core API
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # Production is esbuild-bundled: main.js is served at a content-hashed URL.
          # Read the actual deployed HTML instead of testing a removed source path.
          entry_failed=0
          js_path=''
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --connect-timeout 5 --max-time 12 \
              -o "$tmp/index" -w 'HTML HTTP %{http_code}, TLS verify %{ssl_verify_result}, time %{time_total}s\n' 'https://user.va-tools.ru/'; then
              candidate="$(grep -oE '/assets/[0-9a-f]{20}/user/main-[A-Za-z0-9_-]+\.js' "$tmp/index" | head -n 1 || true)"
              if [[ -n "$candidate" ]]; then js_path="$candidate"; else entry_failed=$((entry_failed + 1)); fi
            else
              entry_failed=$((entry_failed + 1))
            fi
            sleep 1
          done
          echo "HTML failures: $entry_failed/5"
          if (( entry_failed >= 2 )) || [[ -z "$js_path" ]]; then
            echo "::error::User production HTML or versioned JS reference is unstable"
            exit 1
          fi

          js_failed=0
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --connect-timeout 5 --max-time 12 \
              -D "$tmp/headers" -o "$tmp/main.mjs" \
              -w 'JS HTTP %{http_code}, TLS verify %{ssl_verify_result}, time %{time_total}s\n' \
              "https://user.va-tools.ru${js_path}"; then
              if ! grep -qiE '^content-type:.*(javascript|ecmascript)' "$tmp/headers" || [[ ! -s "$tmp/main.mjs" ]]; then
                js_failed=$((js_failed + 1))
              elif ! node --check "$tmp/main.mjs" >/dev/null 2>&1; then
                js_failed=$((js_failed + 1))
              fi
            else
              js_failed=$((js_failed + 1))
            fi
            sleep 1
          done
          echo "Versioned JS failures: $js_failed/5"
          if (( js_failed >= 2 )); then
            echo "::error::User production versioned JavaScript is unstable: $js_failed/5 failed"
            exit 1
          fi

          status="$(curl --silent --show-error --location --connect-timeout 5 --max-time 12 \
            -o /dev/null -w '%{http_code}' 'https://api.va-tools.ru/account/me')"
          if [[ "$status" != 401 && "$status" != 403 ]]; then
            echo "::error::Core API unauthenticated account endpoint returned $status (expected 401/403)"
            exit 1
          fi
          echo 'PASS: User production static entry and Core API boundary'
  runtime:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '5 */6 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify real production User UI
        env:
          USER_RUNTIME_BASE: https://user.va-tools.ru/
        run: node scripts/ci/user-runtime-smoke.mjs
