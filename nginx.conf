server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ~* \.(?:js|mjs|css|json|webmanifest|svg|png)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /service-worker.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
