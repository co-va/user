map $uri $preview_content_type {
  default "application/octet-stream";
  "/" "text/html; charset=utf-8";
  "/__preview_index" "text/html; charset=utf-8";
  ~*\.html$ "text/html; charset=utf-8";
  ~*\.css$ "text/css; charset=utf-8";
  ~*\.(?:js|mjs)$ "application/javascript; charset=utf-8";
  ~*\.json$ "application/json; charset=utf-8";
  ~*\.webmanifest$ "application/manifest+json; charset=utf-8";
  ~*\.svg$ "image/svg+xml";
  ~*\.png$ "image/png";
  ~*\.jpe?g$ "image/jpeg";
  ~*\.ico$ "image/x-icon";
}

server {
  listen 3000 default_server;
  server_name user.va-tools.ru _;
  root /usr/share/nginx/html;
  index index.html;

  location ~* \.(?:js|mjs|css|json|webmanifest|svg|png)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /service-worker.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}

server {
  listen 3000;
  server_name ~^.+\.amvera\.tech$;

  resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;

  location = /api/account/login {
    if ($request_method != POST) { return 405; }

    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name api.va-tools.ru;
    proxy_set_header Host api.va-tools.ru;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_pass https://api.va-tools.ru/account/login;

    add_header Cache-Control "no-store" always;
    add_header X-CO-VA-Preview "staging" always;
  }

  location /api/ {
    # The preview is a functional User application, not a read-only showcase.
    # Core remains the single authenticated API owner; requests carry the user's
    # real session, and Core alone validates permissions and persists changes.

    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name api.va-tools.ru;
    proxy_set_header Host api.va-tools.ru;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_pass https://api.va-tools.ru/;

    add_header Cache-Control "no-store" always;
    add_header X-CO-VA-Preview "staging" always;
  }

  location = / {
    proxy_ssl_server_name on;
    proxy_ssl_name raw.githubusercontent.com;
    proxy_set_header Host raw.githubusercontent.com;
    set $preview_index_upstream https://raw.githubusercontent.com/co-va/user/staging/index.html;
    proxy_pass $preview_index_upstream;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Content-Type;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Disposition;
    add_header Content-Type $preview_content_type always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-CO-VA-Preview "staging" always;
  }

  location ~* \.(?:js|mjs|css|json|webmanifest|svg|png|jpe?g|ico)$ {
    proxy_ssl_server_name on;
    proxy_ssl_name raw.githubusercontent.com;
    proxy_set_header Host raw.githubusercontent.com;
    proxy_pass https://raw.githubusercontent.com/co-va/user/staging$uri$is_args$args;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Content-Type;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Disposition;
    add_header Content-Type $preview_content_type always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-CO-VA-Preview "staging" always;
  }

  location / {
    proxy_intercept_errors on;
    error_page 404 = /__preview_index;

    proxy_ssl_server_name on;
    proxy_ssl_name raw.githubusercontent.com;
    proxy_set_header Host raw.githubusercontent.com;
    proxy_pass https://raw.githubusercontent.com/co-va/user/staging$uri$is_args$args;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Content-Type;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Disposition;
    add_header Content-Type $preview_content_type always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-CO-VA-Preview "staging" always;
  }

  location = /__preview_index {
    internal;
    proxy_ssl_server_name on;
    proxy_ssl_name raw.githubusercontent.com;
    proxy_set_header Host raw.githubusercontent.com;
    set $preview_index_upstream https://raw.githubusercontent.com/co-va/user/staging/index.html;
    proxy_pass $preview_index_upstream;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Content-Type;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Disposition;
    add_header Content-Type $preview_content_type always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-CO-VA-Preview "staging" always;
  }
}
